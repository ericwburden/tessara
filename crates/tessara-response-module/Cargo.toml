[package]
name = "tessara-response-module"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
sprint-8c-upgrade-baseline = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
tessara-module-contract = { path = "../tessara-module-contract" }
tessara-module-runtime = { path = "../tessara-module-runtime" }
tessara-module-ui = { path = "../tessara-module-ui", features = ["ssr"] }
tessara-response-ui = { path = "../tessara-web-responses", features = ["ssr"] }
tessara-responses-contract = { path = "../tessara-responses-contract" }
tessara-forms-contract = { path = "../tessara-forms-contract" }
tessara-workflows-contract = { path = "../tessara-workflows-contract" }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tessara-module-testkit = { path = "../tessara-module-testkit" }
tower = { workspace = true }
