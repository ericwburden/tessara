[package]
name = "tessara-component-module"
version = "1.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
sprint-8a-rehearsal-baseline = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
tessara-components-contract = { path = "../tessara-components-contract" }
tessara-component-ui = { path = "../tessara-component-ui", features = ["ssr"] }
tessara-composition = { path = "../tessara-composition" }
tessara-datasets-contract = { path = "../tessara-datasets-contract" }
tessara-module-contract = { path = "../tessara-module-contract" }
tessara-module-runtime = { path = "../tessara-module-runtime" }
tessara-module-testkit = { path = "../tessara-module-testkit" }
tessara-module-ui = { path = "../tessara-module-ui" }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
