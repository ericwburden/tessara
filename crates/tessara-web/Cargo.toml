[package]
name = "tessara-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "tessara-web-components/hydrate",
    "tessara-web-datasets/hydrate",
    "tessara-web-forms/hydrate",
    "tessara-web-http/hydrate",
    "tessara-web-organization/hydrate",
    "tessara-web-responses/hydrate",
    "tessara-web-workflows/hydrate",
    "tessara-module-ui/hydrate",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "tessara-web-components/ssr",
    "tessara-web-datasets/ssr",
    "tessara-web-forms/ssr",
    "tessara-web-organization/ssr",
    "tessara-web-responses/ssr",
    "tessara-web-workflows/ssr",
    "tessara-module-ui/ssr",
]

[dependencies]
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }
console_error_panic_hook = "0.1"
gloo-net = { workspace = true }
icons = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-module-contract = { path = "../tessara-module-contract" }
tessara-web-components = { path = "../tessara-web-components", default-features = false }
tessara-web-datasets = { path = "../tessara-web-datasets" }
tessara-web-forms = { path = "../tessara-web-forms", default-features = false }
tessara-web-http = { path = "../tessara-web-http", default-features = false }
tessara-web-organization = { path = "../tessara-web-organization", default-features = false }
tessara-web-responses = { path = "../tessara-web-responses", default-features = false }
tessara-web-workflows = { path = "../tessara-web-workflows", default-features = false }
tessara-module-ui = { path = "../tessara-module-ui", features = ["components"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["HtmlAnchorElement"] }
