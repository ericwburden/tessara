[package]
name = "tessara-response-ui"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "tessara-web-http/hydrate",
    "tessara-module-ui/hydrate",
]
ssr = [
    "leptos/ssr",
    "tessara-module-ui/ssr",
]

[dependencies]
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }
gloo-net = { workspace = true }
icons = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-web-http = { path = "../tessara-web-http", default-features = false }
tessara-module-ui = { path = "../tessara-module-ui", default-features = false, features = ["components"] }
tessara-module-contract = { path = "../tessara-module-contract" }
tessara-responses-contract = { path = "../tessara-responses-contract" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
uuid = { workspace = true }
