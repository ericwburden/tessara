[package]
name = "tessara-dashboard-ui"
version = "2.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "tessara-web-component-viewer/hydrate",
    "tessara-web-http/hydrate",
    "tessara-module-ui/hydrate",
]
ssr = [
    "leptos/ssr",
    "tessara-web-component-viewer/ssr",
    "tessara-module-ui/ssr",
]

[dependencies]
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }
gloo-net = { workspace = true }
icons = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-dashboards = { path = "../tessara-dashboards" }
tessara-web-component-viewer = { path = "../tessara-web-component-viewer", default-features = false }
tessara-web-http = { path = "../tessara-web-http", default-features = false }
tessara-module-ui = { path = "../tessara-module-ui", default-features = false }
tessara-module-contract = { path = "../tessara-module-contract" }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlAnchorElement",
    "HtmlDetailsElement",
    "HtmlElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Window",
] }

[dev-dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
