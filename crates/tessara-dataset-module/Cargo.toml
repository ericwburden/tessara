[package]
name = "tessara-dataset-module"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
sprint-8b-upgrade-baseline = []
sprint-8b-validation-faults = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
tessara-control-plane-contract = { path = "../tessara-control-plane-contract" }
tessara-composition = { path = "../tessara-composition" }
tessara-data-ops = { path = "../tessara-data-ops" }
tessara-datasets-contract = { path = "../tessara-datasets-contract" }
tessara-dataset-ui = { path = "../tessara-web-datasets", features = ["ssr"] }
tessara-forms-contract = { path = "../tessara-forms-contract" }
tessara-module-contract = { path = "../tessara-module-contract" }
tessara-module-ui = { path = "../tessara-module-ui" }
tessara-responses-contract = { path = "../tessara-responses-contract" }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
