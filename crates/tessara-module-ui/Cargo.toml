[package]
name = "tessara-module-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
components = ["dep:icons", "dep:js-sys", "dep:leptos", "dep:wasm-bindgen", "dep:web-sys"]
ssr = ["components", "leptos/ssr"]
hydrate = ["components", "leptos/hydrate"]

[dependencies]
icons = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
serde = { workspace = true }
tessara-module-contract = { path = "../tessara-module-contract" }
thiserror = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["CssStyleDeclaration", "Document", "Element", "HtmlCollection", "HtmlElement", "KeyboardEvent", "MediaQueryList", "Storage", "Window"] }

[dev-dependencies]
chrono = { workspace = true }
sha2 = { workspace = true }
