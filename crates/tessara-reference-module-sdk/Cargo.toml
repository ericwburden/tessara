[package]
name = "tessara-reference-module-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tessara-reference-module-sdk"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = []
ssr = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:axum",
    "dep:base64",
    "dep:chrono",
    "dep:tessara-module-runtime",
    "dep:tokio",
    "tessara-module-ui/ssr",
]
hydrate = [
    "dep:wasm-bindgen",
    "dep:web-sys",
    "tessara-module-ui/hydrate",
]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-module-contract = { path = "../tessara-module-contract" }
tessara-module-runtime = { path = "../tessara-module-runtime", optional = true }
tessara-module-ui = { path = "../tessara-module-ui", default-features = false }
tokio = { workspace = true, optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Document", "Element", "Window"] }

[dev-dependencies]
chrono = { workspace = true }
tessara-module-testkit = { path = "../tessara-module-testkit" }
tower = { workspace = true }
