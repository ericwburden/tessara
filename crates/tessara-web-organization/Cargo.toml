[package]
name = "tessara-web-organization"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "tessara-web-http/hydrate",
    "tessara-module-ui/hydrate",
]
ssr = [
    "leptos/ssr",
    "tessara-module-ui/ssr",
]

[dependencies]
gloo-net = { workspace = true }
icons = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-web-http = { path = "../tessara-web-http", default-features = false }
tessara-module-ui = { path = "../tessara-module-ui", default-features = false }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
