[package]
name = "tessara-component-viewer-ui"
version = "1.0.1"
edition = "2024"
publish = false

[features]
default = []
hydrate = [
    "dep:gloo-timers",
    "leptos/hydrate",
    "tessara-web-http/hydrate",
    "tessara-module-ui/hydrate",
]
ssr = [
    "leptos/ssr",
    "tessara-module-ui/ssr",
]

[dependencies]
gloo-timers = { workspace = true, optional = true }
icons = { workspace = true }
leptos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-web-http = { path = "../tessara-web-http", default-features = false }
tessara-module-ui = { path = "../tessara-module-ui", default-features = false, features = ["components"] }
tessara-components-contract = { path = "../tessara-components-contract" }

[dev-dependencies]
uuid = { workspace = true }
