[package]
name = "tessara-component-ui"
version = "1.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "tessara-component-viewer-ui/hydrate",
    "tessara-web-http/hydrate",
]
ssr = [
    "leptos/ssr",
    "tessara-component-viewer-ui/ssr",
    "tessara-module-ui/ssr",
]

[dependencies]
gloo-net = { workspace = true }
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }
icons = { workspace = true }
leptos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tessara-component-viewer-ui = { path = "../tessara-component-viewer-ui", default-features = false }
tessara-datasets-contract = { path = "../tessara-datasets-contract" }
tessara-web-data-ops = { path = "../tessara-web-data-ops" }
tessara-web-http = { path = "../tessara-web-http", default-features = false }
tessara-module-ui = { path = "../tessara-module-ui", features = ["components"] }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
tessara-module-contract = { path = "../tessara-module-contract" }

[dev-dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
