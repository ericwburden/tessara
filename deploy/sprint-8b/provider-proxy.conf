events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    map "${TESSARA_SPRINT_8B_FAULT_KEY}" $sprint_8b_response_incompatible {
        default 0;
        "response.incompatible" 1;
    }

    log_format sprint_8b_fault escape=json
        '{"schema_version":1,"contract":"${TESSARA_SPRINT_8B_FAULT_CONTRACT}",'
        '"fault_key":"${TESSARA_SPRINT_8B_FAULT_KEY}",'
        '"correlation_id":"${TESSARA_SPRINT_8B_FAULT_CORRELATION_ID}",'
        '"target_service":"response-provider-proxy",'
        '"phase":"dataset_bootstrap_provider_validation","attempt":1,'
        '"attempt_limit":${TESSARA_SPRINT_8B_FAULT_ATTEMPT_LIMIT},'
        '"outcome":"rejected_pre_write",'
        '"failure_code":"dataset.dependency_incompatible",'
        '"dataset_transaction":"not_started",'
        '"unauthorized_state":"none","cross_owner_write":"none"}';

    server {
        listen 8080;

        location ~ ^/api/private/responses/submitted-export/(checkpoint|start|page)$ {
            access_log /dev/stdout sprint_8b_fault if=$sprint_8b_response_incompatible;
            default_type "application/vnd.tessara.responses.submitted-response-export+json;version=1";
            if ($sprint_8b_response_incompatible) {
                return 200 '{"schema_version":65535,"fault":"incompatible_provider_contract"}';
            }
            set $core_upstream http://core:8080;
            proxy_pass $core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
        }

        location / {
            set $core_upstream http://core:8080;
            proxy_pass $core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
        }
    }
}
