[workspace]
members = [
    "crates/tessara-analytics",
    "crates/tessara-api",
    "crates/tessara-auth",
    "crates/tessara-components-contract",
    "crates/tessara-composition",
    "crates/tessara-core",
    "crates/tessara-data-ops",
    "crates/tessara-deploy",
    "crates/tessara-datasets",
    "crates/tessara-dashboards",
    "crates/tessara-dashboard-module",
    "crates/tessara-db",
    "crates/tessara-forms",
    "crates/tessara-hierarchy",
    "crates/tessara-installation-control",
    "crates/tessara-jobs",
    "crates/tessara-module-contract",
    "crates/tessara-module-runtime",
    "crates/tessara-module-testkit",
    "crates/tessara-module-ui",
    "crates/tessara-supervisor",
    "crates/tessara-reference-module-sdk",
    "crates/tessara-reference-scoped-records",
    "crates/tessara-submissions",
    "crates/tessara-web",
    "crates/tessara-web-component-viewer",
    "crates/tessara-web-components",
    "crates/tessara-dashboard-ui",
    "crates/tessara-web-data-ops",
    "crates/tessara-web-datasets",
    "crates/tessara-web-forms",
    "crates/tessara-web-http",
    "crates/tessara-web-organization",
    "crates/tessara-web-responses",
    "crates/tessara-web-workflows",
]
resolver = "3"

[profile.test]
debug = 1

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
arrow = "56"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
datafusion = "50"
ed25519-dalek = "2"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
icons = { version = "0.18.2", features = ["leptos"] }
js-sys = "0.3"
leptos = { version = "0.8.17", default-features = false }
leptos_meta = { version = "0.8.5", default-features = false }
leptos_router = { version = "0.8.13", default-features = false }
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Crypto", "DataTransfer", "Document", "DragEvent", "Element", "Event", "EventTarget", "History", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Location", "MediaQueryList", "MouseEvent", "Navigator", "NodeList", "Storage", "UrlSearchParams", "Window"] }

[[workspace.metadata.leptos]]
name = "tessara-web"
bin-package = "tessara-api"
lib-package = "tessara-web"
output-name = "tessara-web"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8080"
assets-dir = "crates/tessara-web/public"
style-file = "style/main.css"
browserquery = "defaults"
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
reload-port = 3001

[[workspace.metadata.leptos]]
name = "tessara-dashboard-ui"
bin-package = "tessara-dashboard-module"
lib-package = "tessara-dashboard-ui"
output-name = "tessara-dashboard-ui"
site-root = "target/dashboard-site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8091"
browserquery = "defaults"
lib-features = ["hydrate"]
bin-default-features = true
lib-default-features = false
